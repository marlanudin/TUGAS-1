<!DOCTYPE html>
<html lang="id">

<head>
    <!-- Mengatur karakter agar mendukung berbagai teks -->
    <meta charset="UTF-8">

    <!-- Mengatur tampilan agar responsif pada berbagai ukuran layar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Menghubungkan font Inter dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Menghubungkan CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Menentukan judul halaman pada tab browser -->
    <title>Dashboard-SITTA UT</title>

    <!-- Menghubungkan file CSS utama -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Menghubungkan Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Menghubungkan SweetAlert2 untuk menampilkan notifikasi -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <!-- NAVBAR: Menampilkan logo dan menu navigasi -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid">

            <!-- Logo SITTA UT yang mengarah ke halaman dashboard -->
            <a class="navbar-brand" href="dashboard.html">
                <img
                    src="img/logo.png"
                    alt="Logo SITTA UT"
                    class="navbar-logo">
            </a>

            <!-- Tombol burger untuk membuka menu pada perangkat mobile -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navmenu"
                aria-controls="navmenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Daftar menu navigasi -->
            <div class="collapse navbar-collapse" id="navmenu">
                <ul class="navbar-nav ms-auto">

                    <!-- Menu menuju halaman beranda -->
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">Beranda</a>
                    </li>

                    <!-- Menu menuju halaman informasi stok bahan ajar -->
                    <li class="nav-item">
                        <a href="stock.html" class="nav-link">Informasi Stok Bahan Ajar</a>
                    </li>

                    <!-- Menu menuju halaman tracking delivery order -->
                    <li class="nav-item">
                        <a href="tracking.html" class="nav-link">Tracking Delivery Order</a>
                    </li>

                    <!-- Menu dropdown untuk pilihan laporan -->
                    <li class="nav-item dropdown">
                        <a
                            class="nav-link dropdown-toggle"
                            href="#"
                            role="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">Laporan</a>

                        <ul class="dropdown-menu">
                            <!-- Pilihan laporan monitoring progres DO -->
                            <li>
                                <a class="dropdown-item" href="#">Monitoring Progres DO Bahan Ajar</a>
                            </li>

                            <!-- Pilihan laporan rekap bahan ajar -->
                            <li>
                                <a class="dropdown-item" href="#">Rekap Bahan Ajar</a>
                            </li>
                        </ul>
                    </li>

                    <!-- Menu menuju histori transaksi bahan ajar -->
                    <li class="nav-item">
                        <a href="#" class="nav-link">Histori Transaksi Bahan Ajar</a>
                    </li>

                    <!-- Tombol logout untuk keluar dari sesi pengguna -->
                    <li class="nav-item logout-container">
                        <button
                            type="button"
                            id="logoutBtn"
                            class="btn btn-logout">
                            <i class="bi bi-box-arrow-right"></i>Logout
                        </button>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- BODY: Konten utama halaman dashboard -->
    <main class="dashboard">

        <!-- GREETING: Menampilkan sapaan dan nama pengguna -->
        <div class="greeting-box">

            <!-- Bagian sapaan yang diisi melalui JavaScript -->
            <h2 id="greeting">
                <span id="timeOfDay"></span><span id="comma">, </span><span id="namaUser"></span>
            </h2>

            <!-- Pesan selamat datang di sistem SITTA Universitas Terbuka -->
            <p>Selamat datang di Dashboard Sistem  Informasi  Tiras  dan  Transaksi  Bahan  Ajar  (SITTA) Universitas Terbuka</p>

        </div>

    </main>

    <!-- Menghubungkan Popper.js yang dibutuhkan oleh beberapa komponen Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>

    <!-- Menghubungkan JavaScript Bootstrap untuk interaksi komponen -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

    <!-- Menghubungkan JavaScript utama untuk mengatur sapaan dan fungsi logout -->
    <script src="js/script.js"></script>

</body>

</html>
