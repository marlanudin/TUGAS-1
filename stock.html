<!-- INFORMASI STOCK -->

<h2 class="stock-title">Informasi Stok Bahan Ajar</h2>

<main class="stock-container">
    <div class="stock-table-wrapper">
        <table class="stock-table">
            <thead>
                <tr>
                    <th>Cover</th>
                    <th>Kode Lokasi</th>
                    <th>Kode Bahan Ajar</th>
                    <th>Nama Bahan Ajar</th>
                    <th>Jenis</th>
                    <th>Edisi</th>
                    <th>Stok</th>
                </tr>
            </thead>
            <tbody id="stokTableBody"></tbody>
        </table>
    </div>

    <!-- Tambah data stock -->
    <div class="tambah-stok">
        <h2>Tambah Stok Baru</h2>
            <form id="formTambah">

                <div class="form-group">
                    <label for="kodeLokasi">Kode Lokasi</label>
                    <input
                        type="text"
                        id="kodeLokasi"
                        placeholder="Kode Lokasi"
                        required>
                </div>

                <div class="form-group">
                    <label for="kodeBahanAjar">Kode Bahan Ajar</label>
                    <input
                        type="text"
                        id="kodeBahanAjar"
                        placeholder="Kode Bahan Ajar"
                        required>
                </div>

                <div class="form-group">
                    <label for="nama">Nama Bahan Ajar</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Nama Bahan Ajar"
                        required>
                </div>

                <div class="form-group">
                    <label for="jenis">Jenis</label>
                    <input
                        type="text"
                        id="jenis"
                        placeholder="Jenis"
                        required>
                </div>

                <div class="form-group">
                    <label for="stok">Jumlah Stok</label>
                    <input
                        type="number"
                        id="stok"
                        placeholder="Jumlah"
                        min="0"
                        required>
                </div>

                <div class="form-group">
                    <label for="edisi">Edisi</label>
                    <input
                        type="text"
                        id="edisi"
                        placeholder="Edisi"
                        required>
                </div>

                <div class="form-group">
                    <label for="cover">Cover</label>
                    <input
                        type="file"
                        id="cover"
                        accept=".jpg,.jpeg,.png"
                        required>
                </div>

                <button type="submit" class="find-button">Tambah</button>

            </form>
        </div>
    </div>
